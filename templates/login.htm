{% extends 'base.htm' %}
{% block content %}
<div class="form-card">
  <h3 class="text-center mb-4" style="font-family:'Playfair Display',serif;">Login</h3>
  <form action="{% url 'login' %}" method="POST" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="form-field-group">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if 'password' in field.name %}
      <span class="password-toggle" onclick="togglePassword(this)">Show</span>
      {% endif %}
      {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="form-submit-btn">Login</button>
  </form>
</div>
<script>
function togglePassword(el) {
  const input = el.previousElementSibling;
  if (input.type === 'password') { input.type = 'text'; el.textContent = 'Hide'; }
  else { input.type = 'password'; el.textContent = 'Show'; }
}
</script>
{% endblock %}
