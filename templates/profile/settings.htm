{% extends 'base.htm' %}
{% block content %}
<div class="row">
  {% include 'profile/sidebar.htm' %}
  <div class="col-md-9">
    <h2>Profile Settings</h2>
    <form method="POST" novalidate style="max-width:480px;">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-field-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
      </div>
      {% endfor %}
      <button type="submit" class="form-submit-btn" style="width:auto; padding:.6rem 1.5rem;">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
